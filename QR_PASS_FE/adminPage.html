<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Team Building 2026 - Admin Dashboard</title>
    <meta name="description" content="Admin Dashboard for UA Team Building 2026 QR Attendance System.">

    <link rel="icon" type="image/png" href="./assets/images/UA-LOGO.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script defer src="./assets/scripts/utils/animation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/alert.css">
    <link rel="stylesheet" href="./assets/css/adminPage.css">
    <link rel="stylesheet" href="./assets/css/blobAnimation.css">
</head>
<body>
    
    <!-- ===== NAVIGATION: Powered by CIT & SSITE ===== -->
    <div class="nav-wrapper">
        <div class="nav-powered-bar">
            <span class="nav-powered-label">Powered by</span>
            <nav class="nav">
                <a href="./index.html"><img src="./assets/images/citlogo.png" alt="CIT Logo" class="nav-logo--cit"></a>
                <a href="./index.html"><img src="./assets/images/ssitelogo.png" alt="SSITE Logo" class="nav-logo--ssite"></a>
            </nav>
        </div>
    </div>

    <div class="blob-outer-container">
        <div class="blob-inner-container"><div class="blob"></div></div>
    </div>

    <div id="adminLogin" class="login-main-container">
        <div class="login-container">
            <img src="./assets/images/UA-LOGO.png" alt="University of the Assumption" style="height: 90px; width: auto; margin-bottom: 0.5rem; align-self: center;">
            <h2 class="login-title">Admin Access</h2>
            
            <div class="form-group">
                <label for="adminUsername">Username</label>
                <input type="text" id="adminUsername" placeholder="Enter credentials">
            </div>
            
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <div class="password-input-container">
                    <input type="password" id="adminPassword" placeholder="Enter password">
                    <button type="button" class="toggle-password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button id="adminLoginBtn" class="login-btn">Secure Login</button>
            <div id="adminLoginStatus" class="login-error hidden">
                <i class="fa-solid fa-circle-exclamation"></i> <span></span>
            </div>
        </div>
    </div>
    
    <div id="adminDashboard" class="container hidden">
        <div class="admin-header">
            <div class="header-title">
                <a href="./index.html" style="display:flex;align-items:center;gap:10px;">
                    <img src="./assets/images/citlogo.png" alt="CIT Logo" style="height:42px;width:auto;">
                    <img src="./assets/images/ssitelogo.png" alt="SSITE Logo" style="height:28px;width:auto;">
                </a>
                <h1>UA Team Building 2026 — Admin</h1>
            </div>
            <button id="logoutBtn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="course-management">
                <i class="fa-solid fa-graduation-cap"></i> Departments
            </div>
            <div class="tab" data-tab="attendance-records">
                <i class="fa-solid fa-clipboard-list"></i> Attendance Records
            </div>
            <div class="tab" data-tab="verify">
                <i class="fa-solid fa-qrcode"></i> Verify QR
            </div>
        </div>
        
        <div id="course-management" class="tab-content active">
            <div class="management-section">
                <h2 class="section-title">Manage Departments</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="courseName">Department</label>
                        <input type="text" id="courseName" placeholder="e.g., College of Information Technology">
                    </div>
                    <div class="form-group">
                        <label for="courseKey">Encryption Key</label>
                        <div class="key-input-container">
                            <input type="text" id="courseKey" placeholder="Min. 16 characters">
                            <button id="generateKeyBtn" class="generate-key-btn" type="button">
                                <i class="fa-solid fa-key"></i> Generate
                            </button>
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button id="addCourseBtn" class="primary-btn"><i class="fa-solid fa-plus"></i> Add Department</button>
                    <button id="updateCourseBtn" class="success-btn hidden">Update</button>
                    <button id="cancelUpdateBtn" class="danger-btn hidden">Cancel</button>
                </div>
                <div id="courseStatus" class="status-message hidden"></div>
                
                <div class="table-container">
                    <table class="courses-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Created Date</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="coursesTableBody"></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button class="pagination-btn" id="prevCoursePage" disabled><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="page-info" id="coursePageInfo">Page 1</span>
                    <button class="pagination-btn" id="nextCoursePage"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
        
        <div id="attendance-records" class="tab-content">
            <div class="filter-section">
                <h2 class="section-title">Attendance Monitoring</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="filterDate">Filter by Date</label>
                        <input type="date" id="filterDate">
                    </div>
                    <div class="form-group">
                        <label for="filterCourse">Filter by Department</label>
                        <select id="filterCourse">
                            <option value="">All Departments</option>
                        </select>
                    </div>
                </div>
                <div class="attendance-btn-container">
                    <button id="filterBtn" class="filter-btn">Apply Filters</button>
                    <button id="downloadPdfBtn" class="filter-btn"><i class="fa-solid fa-file-pdf"></i> Download Report</button>
                    <button id="clearAttendanceBtn" class="danger-btn" style="margin-left: auto;">
                        <i class="fa-solid fa-trash"></i> Clear Data
                    </button>
                </div>
            </div>
            
            <div id="attendanceResults">
                <div class="table-container">
                    <table id="attendanceTable">
                        <thead>
                            <tr>
                                <th>UA ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Time In</th>
                                <th>Time Out</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody"></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button class="pagination-btn" id="prevAttendancePage" disabled><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="page-info" id="attendancePageInfo">Page 1</span>
                    <button class="pagination-btn" id="nextAttendancePage"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <div id="verify" class="tab-content">
            <div class="form-group">
                <label for="verifyCourse">Target Department</label>
                <select id="verifyCourse">
                    <option value="">Select Department to Verify...</option>
                </select>
            </div>
            
            <div class="decrypt-options">
                <button class="scan-btn" id="scanBtn"><i class="fa-solid fa-camera"></i> Start Camera</button>
                <button class="stop-scan-btn hidden" id="stopScanBtn" style="background-color: #C41E3A; color: white; padding: 12px 24px; border-radius: 8px; border:none; font-weight:600;">
                    <i class="fa-solid fa-stop"></i> Stop Camera
                </button>
            </div>
            
            <div id="scannerContainer" class="hidden">
                <video id="scanner"></video>
                <div id="cameraStatus" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px;">Initializing...</div>
            </div>
            
            <div id="verificationResult" class="hidden">
                <div id="verificationMessage"></div>
                <button id="newVerifyBtn" class="primary-btn" style="margin-top: 15px;">
                    <i class="fa-solid fa-qrcode"></i> Scan Next
                </button>
            </div>
        </div>
    </div>

    <div id="editCourseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Edit Record</h2><button class="close-modal">&times;</button></div>
            <div class="form-group"><label>Name</label><input type="text" id="editCourseName"></div>
            <div class="form-group"><label>Encryption Key</label><input type="text" id="editCourseKey"></div>
            <div class="action-buttons">
                <button id="saveCourseBtn" class="primary-btn">Save</button>
                <button id="cancelEditBtn" class="danger-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="deleteCourseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Delete Record</h2><button class="close-modal">&times;</button></div>
            <p id="deleteCourseMessage">Are you sure?</p>
            <div class="action-buttons">
                <button id="confirmDeleteBtn" class="danger-btn">Delete</button>
                <button id="cancelDeleteBtn" class="primary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="customAlert" class="custom-alert">
        <div class="alert-content">
            <span id="alertMessage"></span>
            <button id="alertCloseButton">OK</button>
        </div>
    </div>

    <script type="module" src="./assets/scripts/utils/alert.js"></script>
    <script type="module" src="./assets/scripts/admin.js"></script>
</body>
</html>
